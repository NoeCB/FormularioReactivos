<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Registro de Usuario</ion-title>
    <ion-buttons slot="end">
      <ion-button
        (click)="alternarTema()"
        [attr.aria-label]="temaOscuro ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'">
        <ion-icon
          slot="icon-only"
          [name]="temaOscuro ? 'sunny-outline' : 'moon-outline'"
          aria-hidden="true">
        </ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar color="primary">
      <ion-title size="large">Registro de Usuario</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="contenedor-formulario">
    <form [formGroup]="registroForm" (ngSubmit)="onSubmit()" novalidate>
      <ion-list lines="full">
        <!-- Nombre completo -->
        <ion-item>
          <ion-input
            label="Nombre completo"
            labelPlacement="floating"
            type="text"
            autocomplete="name"
            formControlName="nombre"
            [class.ion-invalid]="f['nombre'].invalid"
            [class.ion-touched]="f['nombre'].touched"
            errorText="El nombre es obligatorio (mínimo 3 caracteres).">
          </ion-input>
        </ion-item>

        <!-- Correo electrónico, con teclado específico en móvil -->
        <ion-item>
          <ion-input
            label="Correo electrónico"
            labelPlacement="floating"
            type="email"
            inputmode="email"
            autocomplete="email"
            formControlName="email"
            [class.ion-invalid]="f['email'].invalid"
            [class.ion-touched]="f['email'].touched"
            errorText="Introduzca un correo electrónico válido.">
          </ion-input>
        </ion-item>

        <!-- Contraseña -->
        <ion-item>
          <ion-input
            label="Contraseña"
            labelPlacement="floating"
            type="password"
            autocomplete="new-password"
            formControlName="password"
            [class.ion-invalid]="f['password'].invalid"
            [class.ion-touched]="f['password'].touched"
            errorText="Mínimo 8 caracteres, con al menos una letra y un número.">
          </ion-input>
        </ion-item>

        <!-- Fecha de nacimiento: abre el calendario al pulsar -->
        <ion-item
          button="true"
          detail="false"
          class="campo-fecha"
          (click)="abrirCalendario()">
          <ion-input
            label="Fecha de nacimiento"
            labelPlacement="floating"
            readonly="true"
            placeholder="Seleccione una fecha"
            [value]="fechaFormateada()">
          </ion-input>
        </ion-item>
        <ion-note
          color="danger"
          class="mensaje-error"
          *ngIf="f['fechaNacimiento'].touched && f['fechaNacimiento'].invalid">
          <span *ngIf="f['fechaNacimiento'].errors?.['required']">
            La fecha de nacimiento es obligatoria.
          </span>
          <span *ngIf="f['fechaNacimiento'].errors?.['fechaFutura']">
            La fecha no puede ser posterior a hoy.
          </span>
        </ion-note>
      </ion-list>

      <div class="acciones">
        <ion-button
          expand="block"
          type="submit"
          [disabled]="registroForm.invalid || isSubmitting()">
          <span *ngIf="!isSubmitting()">Registrarse</span>
          <ion-spinner name="crescent" *ngIf="isSubmitting()"></ion-spinner>
        </ion-button>

        <ion-button
          expand="block"
          fill="outline"
          type="button"
          [disabled]="!ultimosDatos() || isSubmitting()"
          (click)="descargarPdf()">
          <ion-icon slot="start" name="download-outline" aria-hidden="true"></ion-icon>
          Descargar PDF
        </ion-button>
      </div>
    </form>
  </div>

  <!-- Calendario en modal, gobernado desde el componente -->
  <ion-modal
    [isOpen]="calendarioAbierto()"
    (ionModalDidDismiss)="calendarioAbierto.set(false)">
    <ng-template>
      <ion-header>
        <ion-toolbar color="primary">
          <ion-buttons slot="start">
            <ion-button (click)="cancelarFecha()">Cancelar</ion-button>
          </ion-buttons>
          <ion-title>Fecha de nacimiento</ion-title>
          <ion-buttons slot="end">
            <ion-button [strong]="true" (click)="aceptarFecha()">Aceptar</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
        <form [formGroup]="registroForm">
          <ion-datetime
            presentation="date"
            [max]="fechaMaxima"
            formControlName="fechaNacimiento"
            locale="es-ES"
            [showDefaultButtons]="false"
            [preferWheel]="false">
          </ion-datetime>
        </form>
      </ion-content>
    </ng-template>
  </ion-modal>

  <!-- Aviso de confirmación o error tras el envío -->
  <ion-toast
    [isOpen]="toastAbierto()"
    [message]="toastMensaje()"
    [color]="toastColor()"
    [duration]="2500"
    position="bottom"
    (didDismiss)="toastAbierto.set(false)">
  </ion-toast>
</ion-content>
